<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>|||||&#10140;V   CXXIII&#10140;123</title>
    <style>
	    body {
			margin: 0;
			padding: 0;
			--color: #E0E0E0;
			--bg-color: #000000;
            color: var(--color);
			background-color: var(--bg-color);
			--component-bg-color: #E0E0E0;
			--component-color: #000000;
			--component-width: 500px;
            --component-font-size: 26px;
            --component-font-family: "Courier New";
		}
        #labelAN, #labelRN {
			position: absolute;
			left: 504px;
			width: 300px;
            height: 28px;
            font-size: 14px;
        }
		#labelAN {top: -15px;}
		#labelRN {top: 50px;}
        #DisplayRoman, #ConnectRomanToArabic, #DisplayArabic {
            width: var(--component-width);
            height: 30px;
            border: none;
            border-radius: 1px;
            padding: 0px;
            background-color: var(--component-bg-color);
            color: var(--component-color);
            font-size: var(--component-font-size);
            font-family: var(--component-font-family);
            resize: none; /* Prevents resizing of the box */
			text-align: right;
			position: absolute;
			left: 0px;
        }
		#DisplayArabic {top: 0px;}
		#ConnectRomanToArabic {top: 30px;}
		#DisplayRoman {top: 60px;}
		#tally {
			position: absolute;
			left: 0px;
			top: 90px;
            background-color: var(--component-bg-color);
            color: var(--component-color);
            width: var(--component-width);
            height: 300px;
            font-size: var(--component-font-size);
            font-family: var(--component-font-family);
		}
        button {
			position: absolute;
			left: 504px;
            display: block; /* Make buttons block elements */
            width: 25px;
            height: 25px;
            padding: 0px;
            font-size: 21px;
            margin-bottom: 10px; /* Space between buttons */
            cursor: pointer;
            border-color: var(--color);
            background-color: var(--bg-color);
            color: var(--color);
            border: 1px solid;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
		#incrementButton {top: 90px;}
		#decrementButton {top: 120px;}
        button:hover {
            background-color: #C0C0C0;
        }
		button:active {
			font-weight: bold;
		}
    </style>
	<script src="./TalliesToNumerals.js" defer></script>
</head>
<body>
	<input type="text" id="DisplayArabic" maxlength="10"/>
	<p id="labelAN">&#x2190;Arabic numerals, type in a number and press [Enter] or use the [+] and [-] buttons below</p>
	<canvas id="ConnectRomanToArabic"></canvas>
	<canvas id="DisplayRoman"></canvas>
	<p id="labelRN">&#x2190;Roman numerals, simplified (Additive notation)</p>
	<canvas id="tally"></canvas>
	<button id="incrementButton" onclick=incrementNumber()>+</button>
	<button id="decrementButton" onclick=decrementNumber()>-</button>
</body>
</html>
