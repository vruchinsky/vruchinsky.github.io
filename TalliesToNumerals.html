<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>|||||&#10140;V   CXXIII&#10140;123</title>
    <style>
	    body {
			margin: 0;
			padding: 0;
			background-color: #202020;
		}
	    .container {
			width: 600px;
			margin: 5px auto;
		}
		.RomanDisplays {
			width: 500px;
            float: left; /* Float the label to the left */
		}
        /* Container for buttons (float them to the right) */
        .buttons {
			width: 30px;
            float: right; /* Float the buttons container to the right */
            margin-left: 0px; /* Adds space between the text box and buttons */
        }
        /* Style for roman numerals text display box */
        #DisplayRoman, #DisplayRomanWithSpaces {
            float: left; /* Float the label to the left */
            width: 500px;
            height: 25px;
            border: none;
            border-radius: 1px;
            padding: 5px;
            background-color: #E0E0E0;
            color: #404040;
            font-size: 20px;
            font-family: Arial, sans-serif;
            resize: none; /* Prevents resizing of the box */
            overflow: auto; /* Adds scroll if text overflows */
			text-align: right;
        }
		#HorizontalDivider {
            float: left; /* Float the label to the left */
            width: 500px;
            height: 1px;
            border: none;
			background-color: #202020;
		}
        /* Style for each button */
        button {
            display: block; /* Make buttons block elements */
            width: 30px;
            height: 30px;
            padding: 0px;
            font-size: 29px;
            margin-bottom: 10px; /* Space between buttons */
            cursor: pointer;
            background-color: #E0E0E0;
            color: #404040;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #C0C0C0;
        }
		button:active {
			font-weight: bold;
		}
        /* Clear floats */
        .clear {
            clear: both; /* Clears the float and ensures that subsequent elements are not affected */
        }
    </style>
	<script src="./TalliesToNumerals.js" defer></script>
</head>
<body>
	<div class="container">
		<!-- Text display boxes -->
		<div class="RomanDisplays">
			<textarea id="DisplayRomanWithSpaces" readonly></textarea>
			<div id="HorizontalDivider"></div>
			<textarea id="DisplayRoman" readonly></textarea>
		</div>
		<!-- Buttons placed to the right using float -->
		<div class="buttons">
			<button id="incrementButton" onclick=incrementNumber()>+</button>
			<button id="decrementButton" onclick=decrementNumber()>-</button>
		</div>
	</div>
</body>
</html>
