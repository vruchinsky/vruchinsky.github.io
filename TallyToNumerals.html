/*the following code for an on/off toggle switch is adapted from https://www.w3schools.com/howto/howto_css_switch.asp */
.switch {
  position: absolute;
  top: 5px;
  left: 620px;
  width: 30px;
  height: 14px;
  visibility: hidden;
}
.switch input { 
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  -webkit-transition: .1s;
  transition: .1s;
}
.slider:before {
  position: absolute;
  content: "";
  height: 8px;
  width: 8px;
  left: 3px;
  bottom: 3px;
  background-color: #A0A0A0;
  -webkit-transition: .1s;
  transition: .1s;
}
input:checked + .slider {
/*  background-color: #2196F3; */
/*  background-color: #aaa; */
}
input:focus + .slider {
/*  box-shadow: 0 0 1px #2196F3;*/
/*  box-shadow: 0 0 1px #aaa;*/
}
input:checked + .slider:before {
  -webkit-transform: translateX(16px);
  -ms-transform: translateX(16px);
  transform: translateX(16px);
}
/* Rounded sliders */
.slider.round {
  border-radius: 34px;
}
.slider.round:before {
  border-radius: 50%;
}
/*end of code for on/off toggle switch*/
