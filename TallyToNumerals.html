<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>|||||&#10140;V   CXXIII&#10140;123</title>
    <style>
	    body {
			margin: 0;
			padding: 0;
			--color: #A0A0A0;
			--range-control-color: #909090;
			--bg-color: #000000;
            color: var(--color);
			background-color: var(--bg-color);
			--component-bg-color: #E0E0E0;
			--component-color: #000000;
			--component-width: 500px;
            --component-font-size: 26px;
            --component-font-family: "Courier New";
            --controls-font-size: 14px;
		}
		#labelAN, #labelANarrow, #labelANinstructions,
		#labelANinstructionsArrow, #labelRNS, #labelRNA {
			position: absolute;
            height: 28px;
            font-size: var(--controls-font-size);
            color: var(--color);
			background-color: var(--bg-color);
        }
		#labelRNS, #labelRNA {width: 315px;}
		#labelANarrow {left: 504px;}
		#labelANinstructionsArrow {left: 510px;}
		#labelANarrow {width: 5px;}
		#labelAN, #labelANinstructions {left: 520px;}
		#labelAN {width: 100px;}
		#labelANinstructionsArrow {width: 5px;}
		#labelANinstructions {top: 22px;}
		#labelANinstructionsArrow {top: 16px;}
		#labelANinstructions {width: 280px;}
		#labelAN, #labelANarrow {top: 6px;}
		#labelRNS, #labelRNA {left: 504px;}
		#labelRNS {top: 53px;}
		#labelRNA {top: 103px;}
		#DisplayRomanSubtractive, #DisplayRomanAdditive, #DisplayArabic,
			#ConnectRomanAdditiveToSubtractive,	#ConnectRomanToArabic,
			#ConnectRomanToTally {
			width: var(--component-width);
			border: none;
			border-radius: 1px;
			padding: 0px;
			background-color: var(--component-bg-color);
			color: var(--component-color);
			font-size: var(--component-font-size);
			font-family: var(--component-font-family);
			resize: none; /* Prevents resizing of the box */
			text-align: right;
			position: absolute;
			left: 0px;
		}
		#DisplayRomanSubtractive, #DisplayRomanAdditive,
			#ConnectRomanToArabic {height: 20px;}
		#ConnectRomanToTally {height: 20px;}
		#DisplayArabic,	#ConnectRomanAdditiveToSubtractive {height: 30px;}
		#DisplayArabic {top: 0px;}
		#ConnectRomanToArabic {top: 30px;}
		#DisplayRomanSubtractive {top: 50px;}
		#ConnectRomanAdditiveToSubtractive {top: 70px;}
		#DisplayRomanAdditive {top: 100px;}
		#ConnectRomanToTally {top: 120px;}
		#tally {
			position: absolute;
			left: 0px;
			top: 140px;
            background-color: var(--component-bg-color);
            color: var(--component-color);
            width: var(--component-width);
            height: 300px;
            font-size: var(--component-font-size);
            font-family: var(--component-font-family);
		}
		#incrementButton, #decrementButton,
		#ShowHideArabicNumeralsButton, #ShowHideSettingsButton {
			position: absolute;
			padding: 0px;
			cursor: pointer;
			border-color: var(--color);
			background-color: var(--bg-color);
			color: var(--color);
			border: 1px solid;
			border-radius: 5px;
			transition: background-color 0.3s;
		}
		#incrementButton, #decrementButton {
			left: 504px;
			width: 25px;
			height: 25px;
			font-size: 21px;
		}
		#ShowHideArabicNumeralsButton {
			top: 4px;
			left: 615px;
			width: 40px;
            height: 18px;
            font-size: var(--controls-font-size);
		}
		#incrementButton {top: 150px;}
		#decrementButton {top: 180px;}
		#labelAnimationSpeed, #labelAnimationSpeedSlow, #labelAnimationSpeedFast,
			#labelAnimationSpeedMetamorphosis, #labelAnimationSpeedClosingTheGaps,
			#AnimationSpeedMetamorphosis, #AnimationSpeedClosingTheGaps,
			#labelAnimationSpeedMetamorphosisValue,
			#labelAnimationSpeedClosingTheGapsValue {
			position: absolute;
		}
		#labelAnimationSpeed, #labelAnimationSpeedMetamorphosis, #labelAnimationSpeedClosingTheGaps,
			#labelAnimationSpeedSlow, #labelAnimationSpeedFast,
			#labelAnimationSpeedMetamorphosisValue,
			#labelAnimationSpeedClosingTheGapsValue {
            height: 28px;
            font-size: var(--controls-font-size);
            color: var(--color);
			background-color: var(--bg-color);
		}
		#ShowHideSettingsButton {
			font-size: 24px;
			padding-bottom: 10px;
			height: 24px;
			line-height: 24px; /* having the same value as for height helps to center the text, according to https://css-tricks.com/centering-css-complete-guide/ */
			width: 24px;
			top: 442px;
			left: 1px;
			background-color: transparent;
			border-radius: 12px;
		}
		#labelAnimationSpeed, #labelAnimationSpeedSlow, #labelAnimationSpeedFast {top: 466px;}
		#labelAnimationSpeed {width: 100px;}
		#labelAnimationSpeed, #labelAnimationSpeedMetamorphosis,
			#labelAnimationSpeedClosingTheGaps {left: 0px;}
		#labelAnimationSpeedMetamorphosis, #labelAnimationSpeedClosingTheGaps {width: 50px;}
		#AnimationSpeedMetamorphosis, #AnimationSpeedClosingTheGaps,
			#labelAnimationSpeedSlow {left: 100px;}
		#labelAnimationSpeedSlow {width: 30px;}
		#labelAnimationSpeedFast {
			left: 280px;
			width: 30px;
		}
		#labelAnimationSpeedMetamorphosis, #labelAnimationSpeedMetamorphosisValue {top: 488px;}
		#labelAnimationSpeedClosingTheGaps, #labelAnimationSpeedClosingTheGapsValue {top: 508px;}
		#AnimationSpeedMetamorphosis, #AnimationSpeedClosingTheGaps {
			width: 200px;
			height: 1px; /* using minimal height hides the color of the track of the slider */
			accent-color: var(--range-control-color);
		}
		#labelAnimationSpeedMetamorphosisValue, #labelAnimationSpeedClosingTheGapsValue {
			left: 315px;
			width: 60px;
		}
		#AnimationSpeedMetamorphosis {top: 494px;}
		#AnimationSpeedClosingTheGaps {top: 514px;}
		.ArabicNumeralsDisplay {
			visibility: hidden;
		}
		.settings {
			visibility: hidden; /* set to visible for testing and troubleshooting */
		}
		.diagnostics {
			visibility: hidden; /* set to visible for testing and troubleshooting */
		}
	</style>
	<script src="./TallyToNumerals.js" defer></script>
</head>
<body>
	<input type="text" id="DisplayArabic" class="ArabicNumeralsDisplay" maxlength="10"/>
	<label id="labelAN">Arabic numerals</label>
	<label id="labelANarrow" class="ArabicNumeralsDisplay">&larr;</label>
	<label id="labelANinstructions" class="ArabicNumeralsDisplay"></label> <!-- the text content is assigned by JS code-->
	<label id="labelANinstructionsArrow" class="ArabicNumeralsDisplay">&nwarr;</label>
	<button id="ShowHideArabicNumeralsButton" onclick=ShowHideArabicNumerals()></button>
	<canvas id="ConnectRomanToArabic" class="ArabicNumeralsDisplay"></canvas>
	<canvas id="DisplayRomanSubtractive"></canvas>
	<label id="labelRNS">&larr;Roman numerals, usual (subtractive notation)</label>
	<canvas id="ConnectRomanAdditiveToSubtractive"></canvas>
	<canvas id="DisplayRomanAdditive"></canvas>
	<label id="labelRNA">&larr;Roman numerals, simpler (additive notation)</label>
	<canvas id="ConnectRomanToTally"></canvas>
	<canvas id="tally"></canvas>
	<button id="incrementButton" onclick=incrementNumber()>+</button>
	<button id="decrementButton" onclick=decrementNumber()>-</button>
	<button id="ShowHideSettingsButton" onclick=ShowHideSettings()>&#x2699;</button>
	<label id="labelAnimationSpeed" class="settings">animation speed:</label>
	<label id="labelAnimationSpeedMetamorphosis" class="settings">metamorphosis</label>
	<label id="labelAnimationSpeedSlow" class="settings">slow</label>
	<label id="labelAnimationSpeedFast" class="settings">fast</span></label>
	<label id="labelAnimationSpeedMetamorphosisValue"  class="diagnostics" for="AnimationSpeedMetamorphosis"><span id="DisplayAnimationSpeedMetamorphosis" class="diagnostics"></span></label>
	<label id="labelAnimationSpeedClosingTheGaps" class="settings">sliding</label>
	<label id="labelAnimationSpeedClosingTheGapsValue" class="diagnostics" for="AnimationSpeedClosingTheGaps"><span id="DisplayAnimationSpeedClosingTheGaps" class="diagnostics"></span></label>
	<input type="range" id="AnimationSpeedMetamorphosis" class="settings" name="AnimationSpeedMetamorphosis" min="0.0001" max="0.002" step="0.0001" value="0.001"/>
	<input type="range" id="AnimationSpeedClosingTheGaps" class="settings" name="AnimationSpeedClosingTheGaps" min="0.0002" max="0.004" step="0.0001" value="0.004"/>
</body>
</html>
