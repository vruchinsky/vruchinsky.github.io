<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>|||||&#10140;V   CXXIII&#10140;123</title>
    <style>
	    body {
			margin: 0;
			padding: 0;
			--color: #A0A0A0;
			--bg-color: #000000;
            color: var(--color);
			background-color: var(--bg-color);
			--component-bg-color: #E0E0E0;
			--component-color: #000000;
			--component-width: 500px;
            --component-font-size: 26px;
            --component-font-family: "Courier New";
		}
        #labelAN, #labelRNS, #labelRNA {
			position: absolute;
			left: 504px;
			width: 300px;
            height: 28px;
            font-size: 14px;
            color: var(--color);
			background-color: var(--bg-color);
        }
		#labelAN {top: -10px;}
		#labelRNS {top: 50px;}
		#labelRNA {top: 100px;}
        #DisplayRomanSubtractive, #ConnectRomanAdditiveToSubtractive,
		#DisplayRomanAdditive, #ConnectRomanToArabic, #DisplayArabic {
            width: var(--component-width);
            border: none;
            border-radius: 1px;
            padding: 0px;
            background-color: var(--component-bg-color);
            color: var(--component-color);
            font-size: var(--component-font-size);
            font-family: var(--component-font-family);
            resize: none; /* Prevents resizing of the box */
			text-align: right;
			position: absolute;
			left: 0px;
        }
        #DisplayRomanSubtractive {height: 20px;}
		#ConnectRomanAdditiveToSubtractive, #DisplayRomanAdditive,
		#ConnectRomanToArabic, #DisplayArabic {height: 30px;}
		#DisplayArabic {top: 0px;}
		#ConnectRomanToArabic {top: 30px;}
		#DisplayRomanSubtractive {top: 60px;}
		#ConnectRomanAdditiveToSubtractive {top: 80px;}
		#DisplayRomanAdditive {top: 110px;}
		#tally {
			position: absolute;
			left: 0px;
			top: 140px;
            background-color: var(--component-bg-color);
            color: var(--component-color);
            width: var(--component-width);
            height: 300px;
            font-size: var(--component-font-size);
            font-family: var(--component-font-family);
		}
        button {
			position: absolute;
			left: 504px;
            display: block; /* Make buttons block elements */
            width: 25px;
            height: 25px;
            padding: 0px;
            font-size: 21px;
            margin-bottom: 10px; /* Space between buttons */
            cursor: pointer;
            border-color: var(--color);
            background-color: var(--bg-color);
            color: var(--color);
            border: 1px solid;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
		#incrementButton {top: 150px;}
		#decrementButton {top: 180px;}
        button:hover {
            background-color: #707070;
        }
		button:active {
			font-weight: bold;
		}
        #labelAnimationSpeed {
			position: absolute;
			left: 0px;
			top: 445px;
			width: 300px;
            height: 28px;
            font-size: 14px;
            color: var(--color);
			background-color: var(--bg-color);
		}
		#AnimationSpeedMetamorphosis {
			position: absolute;
			left: 0px;
			top: 460px;
			width: 200px;
            height: 28px;
			accent-color: var(--color);
		}
        #labelAnimationSpeedMetamorphosis {
			position: absolute;
			left: 210px;
			top: 467px;
			width: 300px;
            height: 28px;
            font-size: 14px;
            color: var(--color);
			background-color: var(--bg-color);
		}
		#AnimationSpeedClosingTheGaps {
			position: absolute;
			left: 0px;
			top: 480px;
			width: 200px;
            height: 28px;
			accent-color: var(--color);
		}
        #labelAnimationSpeedClosingTheGaps {
			position: absolute;
			left: 210px;
			top: 487px;
			width: 300px;
            height: 28px;
            font-size: 14px;
            color: var(--color);
			background-color: var(--bg-color);
		}
    </style>
	<script src="./TallyToNumerals.js" defer></script>
</head>
<body>
	<input type="text" id="DisplayArabic" maxlength="10"/>
	<p id="labelAN">&#x2190;Arabic numerals, type in a number (at least 0 but less than 5000) and press [Enter] or use the buttons below</p>
	<canvas id="ConnectRomanToArabic"></canvas>
	<canvas id="DisplayRomanSubtractive"></canvas>
	<p id="labelRNS">&#x2190;Roman numerals, usual (subtractive notation)</p>
	<canvas id="ConnectRomanAdditiveToSubtractive"></canvas>
	<canvas id="DisplayRomanAdditive"></canvas>
	<p id="labelRNA">&#x2190;Roman numerals, simple (additive notation)</p>
	<canvas id="tally"></canvas>
	<button id="incrementButton" onclick=incrementNumber()>+</button>
	<button id="decrementButton" onclick=decrementNumber()>-</button>
	<label id="labelAnimationSpeed">animation speed:</label>
	<input type="range" id="AnimationSpeedMetamorphosis" name="AnimationSpeedMetamorphosis" min="0.0001" max="0.002" step="0.0001" value="0.001"/>
	<label id="labelAnimationSpeedMetamorphosis" for="AnimationSpeedMetamorphosis">changing numerals <span id="DisplayAnimationSpeedMetamorphosis"></span></label>
	<input type="range" id="AnimationSpeedClosingTheGaps" name="AnimationSpeedClosingTheGaps" min="0.0002" max="0.004" step="0.0001" value="0.004"/>
	<label id="labelAnimationSpeedClosingTheGaps" for="AnimationSpeedClosingTheGaps">closing the gaps <span id="DisplayAnimationSpeedClosingTheGaps"></span></label>
</body>
</html>
